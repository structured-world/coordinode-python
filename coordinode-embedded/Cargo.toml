[package]
name = "coordinode-embedded"
# Written by the release PR, not by hand. It is the one version this repository
# ships under, shared with the three Python packages, which read it from the tag
# through hatch-vcs. maturin has no equivalent and takes the wheel version from
# here, so this line has to move with the release or the wheel keeps the name it
# had last time and PyPI refuses it as a duplicate.
version = "2.1.1"
edition = "2021"
rust-version = "1.90"
description = "CoordiNode embedded Python bindings — in-process graph database, no server required"
license = "Apache-2.0"
repository = "https://github.com/structured-world/coordinode-python"
readme = "README.md"

[lib]
name = "_coordinode_embedded"
crate-type = ["cdylib"]

[dependencies]
# Moving the coordinode-rs submodule means refreshing Cargo.lock here in the
# same commit. These are path dependencies, so their own registry dependencies
# are resolved by THIS lock: an engine release that needs a newer storage
# engine still compiles against whatever version the lock names, and fails on
# the API it expected to find.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }
numpy = "0.24"
coordinode-embed = { path = "../coordinode-rs/crates/coordinode-embed" }
coordinode-core = { path = "../coordinode-rs/crates/coordinode-core" }
coordinode-vector = { path = "../coordinode-rs/crates/coordinode-vector" }
rmpv = "1"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
